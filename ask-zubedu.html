<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ask ZubEdu</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f8ff;
}

header{
    background:#0879d1;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px #ccc;
}

textarea{
    width:100%;
    height:130px;
    padding:15px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:0;
    border-radius:8px;
    background:#0879d1;
    color:white;
    font-size:16px;
    cursor:pointer;
}

#answer{
    margin-top:25px;
    padding:18px;
    background:#f1f7ff;
    border-radius:10px;
    min-height:40px;
}
</style>
</head>

<body>

<header>
    <h1>🤖 Ask ZubEdu</h1>
    <p>Ask your study question</p>
</header>

<div class="container">

    <h2>Ask Your Question</h2>

    <textarea id="question"
    placeholder="Example: What is photosynthesis?"></textarea>

    <br>

    <button onclick="askAI()">Get Answer</button>

    <div id="answer">
        Your answer will appear here.
    </div>

</div>

<script>

function askAI(){

    var question = document.getElementById("question").value.trim();
    var answer = document.getElementById("answer");

    if(question === ""){
        answer.innerHTML = "⚠️ Please enter a question.";
        return;
    }

    answer.innerHTML = "⏳ ZubEdu AI is thinking...";

    var xhr = new XMLHttpRequest();

    xhr.open("POST", "/ask", true);

    xhr.setRequestHeader(
        "Content-Type",
        "application/json"
    );

    xhr.onreadystatechange = function(){

        if(xhr.readyState === 4){

            if(xhr.status === 200){

                try{

                    var data = JSON.parse(xhr.responseText);

                    if(data.answer){
                        answer.innerHTML =
                        "<b>🤖 ZubEdu AI:</b><br><br>" +
                        data.answer;
                    }
                    else{
                        answer.innerHTML =
                        "❌ AI answer nahi mila.";
                    }

                }catch(e){

                    answer.innerHTML =
                    "❌ Server response error.";

                }

            }else{

                answer.innerHTML =
                "❌ Server error: " + xhr.status;

            }
        }
    };

    xhr.send(JSON.stringify({
        question: question,
        studentClass:
        localStorage.getItem("zubeduClass") || "10"
    }));
}

</script>

</body>
</html>
