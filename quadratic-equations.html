<div class="question">
<h2>Important Question 1</h2>

<p>Solve x² − 5x + 6 = 0 by factorisation.</p>

<div class="solution">
<b>Solution:</b><br><br>

x² − 5x + 6 = 0<br>
(x − 2)(x − 3) = 0<br><br>

Therefore,<br>
x − 2 = 0 → x = 2<br>
x − 3 = 0 → x = 3<br><br>

<b>Answer: x = 2, 3</b>
</div>
