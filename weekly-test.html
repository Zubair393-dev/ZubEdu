<!DOCTYPE html>
<html>
<head>
<title>Weekly Test - ZubEdu</title>
<style>
body{font-family:Arial;background:#f4f8ff;margin:0;color:#17324d}
header{background:#1565c0;color:white;text-align:center;padding:25px}
main{max-width:800px;margin:auto;padding:20px}
.q{background:white;padding:18px;margin:12px 0;border-radius:12px}
button{background:#1565c0;color:white;border:0;padding:12px 20px;border-radius:8px}
#timer{text-align:center;font-size:24px;color:#d32f2f}
</style>
</head>
<body>

<header><h1>ZubEdu</h1><p>📝 Weekly Test</p></header>

<main>
<h2>Class 10 Mixed Test</h2>
<div id="timer">10:00</div>

<form id="test">

<div class="q">1. HCF of 24 and 36?
<br><input type="radio" name="q1" value="0"> 6
<br><input type="radio" name="q1" value="1"> 12
<br><input type="radio" name="q1" value="0"> 18</div>

<div class="q">2. Ohm's Law?
<br><input type="radio" name="q2" value="1"> V = IR
<br><input type="radio" name="q2" value="0"> V = I/R
<br><input type="radio" name="q2" value="0"> R = VI</div>

<div class="q">3. Photosynthesis mainly occurs in?
<br><input type="radio" name="q3" value="1"> Leaves
<br><input type="radio" name="q3" value="0"> Roots
<br><input type="radio" name="q3" value="0"> Flowers</div>

<div class="q">4. Indian Constitution came into effect in?
<br><input type="radio" name="q4" value="1"> 1950
<br><input type="radio" name="q4" value="0"> 1947
<br><input type="radio" name="q4" value="0"> 1952</div>

<div class="q">5. Probability of a head in one coin toss?
<br><input type="radio" name="q5" value="1"> 1/2
<br><input type="radio" name="q5" value="0"> 1/3
<br><input type="radio" name="q5" value="0"> 1/4</div>

<button type="button" onclick="submitTest()">Submit Test</button>
</form>

<h2 id="result"></h2>
</main>

<script>
let time=600;
let timer=setInterval(function(){
time--;
let m=Math.floor(time/60),s=time%60;
document.getElementById("timer").innerText=m+":"+(s<10?"0":"")+s;
if(time<=0){clearInterval(timer);submitTest();}
},1000);

function submitTest(){
clearInterval(timer);
let score=0;
document.querySelectorAll("input:checked").forEach(function(x){
score+=Number(x.value);
});
document.getElementById("result").innerText="🎉 Score: "+score+"/5";
localStorage.setItem("weeklyScore", score);
localStorage.setItem("weeklyCompleted", "1");
} </script>
</body>
</html>
